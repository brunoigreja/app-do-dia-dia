name: Build APK e Publicar Release

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag da release (ex: v1.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build APK com EAS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Configurar Expo e EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK no EAS Cloud
        run: |
          eas build --platform android --profile preview --non-interactive --wait --json > build_output.json
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Baixar APK gerado
        run: |
          APK_URL=$(node -p 'const data = require("./build_output.json"); (Array.isArray(data) ? data[0] : data).artifacts?.applicationArchiveUrl || ""')
          if [ -z "$APK_URL" ]; then
            echo "Erro: URL do APK não encontrada na saída do EAS!"
            cat build_output.json
            exit 1
          fi
          echo "Baixando APK de: $APK_URL"
          curl -L -o ./app-do-dia-dia.apk "$APK_URL"

      - name: Determinar versão da tag
        id: versao
        run: |
          if [ -n "${{ github.event.inputs.version_tag }}" ]; then
            echo "tag=${{ github.event.inputs.version_tag }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(node -p "require('./package.json').version")
            COMMIT_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "tag=v${VERSION}-${COMMIT_SHORT}" >> $GITHUB_OUTPUT
          fi

      - name: Criar GitHub Release com APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versao.outputs.tag }}
          name: "Diário do Dia ${{ steps.versao.outputs.tag }}"
          body: |
            ## 📱 Diário do Dia — ${{ steps.versao.outputs.tag }}

            ### Como instalar no Android
            1. Baixe o arquivo `app-do-dia-dia.apk` abaixo
            2. No seu Android, habilite **"Instalar apps de fontes desconhecidas"** nas configurações
            3. Abra o APK baixado e instale

            ---
            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}
          files: ./app-do-dia-dia.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
